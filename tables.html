<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      table,
      th,
      td {
        border: 1px solid lightblue;
        border-collapse: collapse;
        width: 450px;
      }
      th {
        background-color: rgba(211, 211, 211, 0.384);
        text-align: start;
        vertical-align: bottom;
        height: 50px;
      }
      td {
        height: 45px;
        vertical-align: bottom;
      }
    </style>
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th>Product</th>
          <th>Category</th>
          <th>Price</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Laptop</td>
          <td>Electronic</td>
          <td>$800</td>
        </tr>
        <tr>
          <td>Bookshelf</td>
          <td>Furniture</td>
          <td>$150</td>
        </tr>
        <tr>
          <td>Coffee Maker</td>
          <td>Appliance</td>
          <td>$50</td>
        </tr>
      </tbody>
    </table>
    <table>
      <thead>
        <tr>
          <th>Column 1</th>
          <th>Column 2</th>
          <th>Column 3</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td rowspan="2">Row 1 Cell 1</td>
          <td>Row 1 Cell 2</td>
          <td>Row 1 Cell 3</td>
        </tr>
        <tr>
          <td>Row 2 Cell 1</td>
          <td>Row 2 Cell 2</td>
        </tr>
        <tr>
            <td colspan="3">Row 3 Cell 1</td>
        </tr>
      </tbody>


      
  </body>
</html>
